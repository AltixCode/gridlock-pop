name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        default: preview
        options: [preview, production]
      platform:
        description: Target platform
        type: choice
        default: all
        options: [all, ios, android]
  push:
    tags: ['v*']

jobs:
  build:
    name: Build ${{ github.event.inputs.profile || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify before building
        run: |
          npm run lint
          npm run typecheck
          npm run test:ci

      # A store build missing its real ad units does not fail — it silently serves Google test
      # ads and earns nothing. Only production is gated; preview builds are meant to run on
      # test units.
      - name: Check release identifiers
        if: ${{ (github.event.inputs.profile || 'production') == 'production' }}
        env:
          EXPO_PUBLIC_ADMOB_IOS_APP_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_APP_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_APP_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_APP_ID }}
          EXPO_PUBLIC_ADMOB_IOS_INTERSTITIAL: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_INTERSTITIAL }}
          EXPO_PUBLIC_ADMOB_ANDROID_INTERSTITIAL: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_INTERSTITIAL }}
          EXPO_PUBLIC_ADMOB_IOS_REWARDED: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_REWARDED }}
          EXPO_PUBLIC_ADMOB_ANDROID_REWARDED: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_REWARDED }}
          EXPO_PUBLIC_ADMOB_IOS_BANNER: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_BANNER }}
          EXPO_PUBLIC_ADMOB_ANDROID_BANNER: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_BANNER }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
        run: npm run check:release

      # Store-bound builds must never be cut from unverified code, so the checks above gate this.
      - name: EAS build
        run: |
          eas build \
            --profile ${{ github.event.inputs.profile || 'production' }} \
            --platform ${{ github.event.inputs.platform || 'all' }} \
            --non-interactive \
            --no-wait
