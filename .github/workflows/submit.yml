name: EAS Submit

# Submission is always a deliberate, manual act — never automatic on a push.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store to submit to
        type: choice
        default: all
        options: [all, ios, android]

jobs:
  submit:
    name: Submit latest production build
    runs-on: ubuntu-latest
    environment: store-release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Write Play service account key
        if: ${{ github.event.inputs.platform != 'ios' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json

      - name: Submit
        env:
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          eas submit \
            --profile production \
            --platform ${{ github.event.inputs.platform || 'all' }} \
            --latest \
            --non-interactive

      - name: Remove service account key
        if: always()
        run: rm -f play-service-account.json
